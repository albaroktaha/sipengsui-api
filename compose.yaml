services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sipengsui}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sipengsui}
      POSTGRES_DB: ${POSTGRES_DB:-sipengsui}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sipengsui} -d ${POSTGRES_DB:-sipengsui}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-sipengsui}:${POSTGRES_PASSWORD:-sipengsui}@db:5432/${POSTGRES_DB:-sipengsui}?schema=public
      # Auth
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      # Server
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3001}
      # Jumlah reverse proxy di depan API (Cloudflare/Nginx umumnya 1)
      TRUST_PROXY: ${TRUST_PROXY:-1}
      # Rekomtek checklist storage privat dan validasi
      REKOMTEK_BERKAS_STORAGE_DIR: ${REKOMTEK_BERKAS_STORAGE_DIR:-/app/storage/rekomtek-berkas}
      REKOMTEK_DRIVE_TIMEOUT_MS: ${REKOMTEK_DRIVE_TIMEOUT_MS:-10000}
      REKOMTEK_DEFAULT_MAX_FILE_SIZE_BYTES: ${REKOMTEK_DEFAULT_MAX_FILE_SIZE_BYTES:-10485760}
      REKOMTEK_ANTIVIRUS_COMMAND: ${REKOMTEK_ANTIVIRUS_COMMAND:-}
      REKOMTEK_ANTIVIRUS_TIMEOUT_MS: ${REKOMTEK_ANTIVIRUS_TIMEOUT_MS:-30000}
      # News CMS storage: local untuk development, s3/r2 untuk production
      NEWS_STORAGE_DRIVER: ${NEWS_STORAGE_DRIVER:-local}
      NEWS_STORAGE_PUBLIC_URL: ${NEWS_STORAGE_PUBLIC_URL:-http://localhost:3000}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-auto}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:-}
      # Mail (kosongkan MAIL_HOST untuk mode dev)
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_SECURE: ${MAIL_SECURE:-false}
      MAIL_USER: ${MAIL_USER:-}
      MAIL_PASS: ${MAIL_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-Sipengsui <noreply@sipengsui.id>}
      # Email verification
      APP_URL: ${APP_URL:-http://localhost:3001}
      VERIFY_TOKEN_TTL_MINUTES: ${VERIFY_TOKEN_TTL_MINUTES:-60}
      VERIFY_RESEND_COOLDOWN_MINUTES: ${VERIFY_RESEND_COOLDOWN_MINUTES:-5}
      # reCAPTCHA v2 (kosongkan untuk mode dev)
      RECAPTCHA_SECRET_KEY: ${RECAPTCHA_SECRET_KEY:-}
      RECAPTCHA_SITE_KEY: ${RECAPTCHA_SITE_KEY:-}
      # Session idle timeout
      SESSION_IDLE_TIMEOUT_MINUTES: ${SESSION_IDLE_TIMEOUT_MINUTES:-120}
      # Gemini AI
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash}
      AI_CHAT_ENABLED: ${AI_CHAT_ENABLED:-true}
      AI_MAX_INPUT_CHARS: ${AI_MAX_INPUT_CHARS:-4000}
      AI_MAX_HISTORY_MESSAGES: ${AI_MAX_HISTORY_MESSAGES:-12}
      AI_MAX_OUTPUT_TOKENS: ${AI_MAX_OUTPUT_TOKENS:-900}
      AI_RATE_LIMIT: ${AI_RATE_LIMIT:-10}
      AI_RATE_TTL_MS: ${AI_RATE_TTL_MS:-60000}
      # WhatsApp WAHA/SumoPod (disabled by default)
      WHATSAPP_ENABLED: ${WHATSAPP_ENABLED:-false}
      WHATSAPP_PROVIDER: ${WHATSAPP_PROVIDER:-waha}
      WAHA_BASE_URL: ${WAHA_BASE_URL:-}
      WAHA_API_KEY: ${WAHA_API_KEY:-}
      WAHA_SESSION: ${WAHA_SESSION:-default}
      WAHA_WEBHOOK_HMAC_KEY: ${WAHA_WEBHOOK_HMAC_KEY:-}
      WAHA_WEBHOOK_CUSTOM_SECRET: ${WAHA_WEBHOOK_CUSTOM_SECRET:-}
      WAHA_EXPECTED_ENGINE: ${WAHA_EXPECTED_ENGINE:-}
      WAHA_WEBHOOK_MAX_CLOCK_SKEW_SECONDS: ${WAHA_WEBHOOK_MAX_CLOCK_SKEW_SECONDS:-300}
      WAHA_SESSION_HEALTH_CACHE_MS: ${WAHA_SESSION_HEALTH_CACHE_MS:-10000}
      WAHA_SEND_MIN_INTERVAL_MS: ${WAHA_SEND_MIN_INTERVAL_MS:-1500}
      WHATSAPP_DEFAULT_COUNTRY_CODE: ${WHATSAPP_DEFAULT_COUNTRY_CODE:-62}
      WHATSAPP_DEFAULT_LANGUAGE: ${WHATSAPP_DEFAULT_LANGUAGE:-id}
      WHATSAPP_WEBHOOK_MAX_BODY_BYTES: ${WHATSAPP_WEBHOOK_MAX_BODY_BYTES:-262144}
      WHATSAPP_OUTBOX_BATCH_SIZE: ${WHATSAPP_OUTBOX_BATCH_SIZE:-25}
      WHATSAPP_DISPATCH_LOCK_TTL_MS: ${WHATSAPP_DISPATCH_LOCK_TTL_MS:-120000}
      WHATSAPP_MAX_ATTEMPTS: ${WHATSAPP_MAX_ATTEMPTS:-6}
      WHATSAPP_INBOX_MAX_ATTEMPTS: ${WHATSAPP_INBOX_MAX_ATTEMPTS:-6}
      WHATSAPP_INBOX_RETRY_BASE_MS: ${WHATSAPP_INBOX_RETRY_BASE_MS:-15000}
      WHATSAPP_CONNECT_TIMEOUT_MS: ${WHATSAPP_CONNECT_TIMEOUT_MS:-5000}
      WHATSAPP_RESPONSE_TIMEOUT_MS: ${WHATSAPP_RESPONSE_TIMEOUT_MS:-10000}
      WHATSAPP_RETENTION_DAYS: ${WHATSAPP_RETENTION_DAYS:-90}
      WHATSAPP_PAIRING_TTL_MINUTES: ${WHATSAPP_PAIRING_TTL_MINUTES:-10}
      WHATSAPP_PAIRING_MAX_ATTEMPTS: ${WHATSAPP_PAIRING_MAX_ATTEMPTS:-5}
      WHATSAPP_PAIRING_RATE_LIMIT: ${WHATSAPP_PAIRING_RATE_LIMIT:-10}
      WHATSAPP_PAIRING_RATE_WINDOW_MINUTES: ${WHATSAPP_PAIRING_RATE_WINDOW_MINUTES:-15}
      WHATSAPP_CONVERSATION_STATE_TTL_MINUTES: ${WHATSAPP_CONVERSATION_STATE_TTL_MINUTES:-30}
      WHATSAPP_SERVICE_WINDOW_HOURS: ${WHATSAPP_SERVICE_WINDOW_HOURS:-24}
      WHATSAPP_AI_RATE_LIMIT: ${WHATSAPP_AI_RATE_LIMIT:-10}
      WHATSAPP_AI_RATE_WINDOW_MINUTES: ${WHATSAPP_AI_RATE_WINDOW_MINUTES:-1}
      WHATSAPP_STATUS_RATE_LIMIT: ${WHATSAPP_STATUS_RATE_LIMIT:-10}
      WHATSAPP_STATUS_RATE_WINDOW_MINUTES: ${WHATSAPP_STATUS_RATE_WINDOW_MINUTES:-1}
      WHATSAPP_CONSENT_TEXT_VERSION: ${WHATSAPP_CONSENT_TEXT_VERSION:-v1}
      WHATSAPP_MESSAGE_STAGE_CHANGED_VERSION: ${WHATSAPP_MESSAGE_STAGE_CHANGED_VERSION:-v1}
      WHATSAPP_MESSAGE_CORRECTION_REQUIRED_VERSION: ${WHATSAPP_MESSAGE_CORRECTION_REQUIRED_VERSION:-v1}
      WHATSAPP_MESSAGE_EXPOSE_SCHEDULED_VERSION: ${WHATSAPP_MESSAGE_EXPOSE_SCHEDULED_VERSION:-v1}
      WHATSAPP_MESSAGE_EXPOSE_RESCHEDULED_VERSION: ${WHATSAPP_MESSAGE_EXPOSE_RESCHEDULED_VERSION:-v1}
      WHATSAPP_MESSAGE_EXPOSE_CANCELLED_VERSION: ${WHATSAPP_MESSAGE_EXPOSE_CANCELLED_VERSION:-v1}
      WHATSAPP_MESSAGE_EXPOSE_REMINDER_VERSION: ${WHATSAPP_MESSAGE_EXPOSE_REMINDER_VERSION:-v1}
      WHATSAPP_EXPOSE_REMINDERS_ENABLED: ${WHATSAPP_EXPOSE_REMINDERS_ENABLED:-false}
      WHATSAPP_EXPOSE_REMINDER_OFFSETS_MINUTES: ${WHATSAPP_EXPOSE_REMINDER_OFFSETS_MINUTES:-1440,60}
      WHATSAPP_MESSAGE_REJECTED_VERSION: ${WHATSAPP_MESSAGE_REJECTED_VERSION:-v1}
      WHATSAPP_MESSAGE_PUBLISHED_VERSION: ${WHATSAPP_MESSAGE_PUBLISHED_VERSION:-v1}
      WHATSAPP_MESSAGE_CONVERSATION_REPLY_VERSION: ${WHATSAPP_MESSAGE_CONVERSATION_REPLY_VERSION:-v1}
      # Model Armor (opsional)
      MODEL_ARMOR_ENABLED: ${MODEL_ARMOR_ENABLED:-false}
      MODEL_ARMOR_PROJECT_ID: ${MODEL_ARMOR_PROJECT_ID:-}
      MODEL_ARMOR_LOCATION: ${MODEL_ARMOR_LOCATION:-}
      MODEL_ARMOR_TEMPLATE_ID: ${MODEL_ARMOR_TEMPLATE_ID:-}
      # Seed (true hanya sekali pada deploy pertama)
      RUN_SEED: ${RUN_SEED:-false}
    ports:
      - "${API_PORT:-3000}:3000"
    volumes:
      - uploads-data:/app/uploads
      - rekomtek-storage-data:/app/storage
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
  uploads-data:
  rekomtek-storage-data:
