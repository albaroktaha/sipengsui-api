services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sipengsui}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sipengsui}
      POSTGRES_DB: ${POSTGRES_DB:-sipengsui}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sipengsui} -d ${POSTGRES_DB:-sipengsui}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-sipengsui}:${POSTGRES_PASSWORD:-sipengsui}@db:5432/${POSTGRES_DB:-sipengsui}?schema=public
      # Auth
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      # Server
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3001}
      # News CMS storage: local untuk development, s3/r2 untuk production
      NEWS_STORAGE_DRIVER: ${NEWS_STORAGE_DRIVER:-local}
      NEWS_STORAGE_PUBLIC_URL: ${NEWS_STORAGE_PUBLIC_URL:-http://localhost:3000}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-auto}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:-}
      # Mail (kosongkan MAIL_HOST untuk mode dev)
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_SECURE: ${MAIL_SECURE:-false}
      MAIL_USER: ${MAIL_USER:-}
      MAIL_PASS: ${MAIL_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-Sipengsui <noreply@sipengsui.id>}
      # Email verification
      APP_URL: ${APP_URL:-http://localhost:3001}
      VERIFY_TOKEN_TTL_MINUTES: ${VERIFY_TOKEN_TTL_MINUTES:-60}
      VERIFY_RESEND_COOLDOWN_MINUTES: ${VERIFY_RESEND_COOLDOWN_MINUTES:-5}
      # reCAPTCHA v2 (kosongkan untuk mode dev)
      RECAPTCHA_SECRET_KEY: ${RECAPTCHA_SECRET_KEY:-}
      RECAPTCHA_SITE_KEY: ${RECAPTCHA_SITE_KEY:-}
      # Session idle timeout
      SESSION_IDLE_TIMEOUT_MINUTES: ${SESSION_IDLE_TIMEOUT_MINUTES:-120}
      # Gemini AI
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash}
      AI_CHAT_ENABLED: ${AI_CHAT_ENABLED:-true}
      AI_MAX_INPUT_CHARS: ${AI_MAX_INPUT_CHARS:-4000}
      AI_MAX_HISTORY_MESSAGES: ${AI_MAX_HISTORY_MESSAGES:-12}
      AI_MAX_OUTPUT_TOKENS: ${AI_MAX_OUTPUT_TOKENS:-900}
      AI_RATE_LIMIT: ${AI_RATE_LIMIT:-10}
      AI_RATE_TTL_MS: ${AI_RATE_TTL_MS:-60000}
      # Model Armor (opsional)
      MODEL_ARMOR_ENABLED: ${MODEL_ARMOR_ENABLED:-false}
      MODEL_ARMOR_PROJECT_ID: ${MODEL_ARMOR_PROJECT_ID:-}
      MODEL_ARMOR_LOCATION: ${MODEL_ARMOR_LOCATION:-}
      MODEL_ARMOR_TEMPLATE_ID: ${MODEL_ARMOR_TEMPLATE_ID:-}
      # Seed (true hanya sekali pada deploy pertama)
      RUN_SEED: ${RUN_SEED:-false}
    ports:
      - "${API_PORT:-3000}:3000"
    volumes:
      - uploads-data:/app/uploads
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
  uploads-data:
